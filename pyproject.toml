[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-app-mcp"
version = "0.5.3"
description = "Governed MCP gateway for OpenAI Codex app-server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
codex-app-mcp = "codex_app_mcp.server:main"

[tool.setuptools.packages.find]
include = ["codex_app_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
